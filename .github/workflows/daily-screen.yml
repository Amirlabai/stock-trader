name: Daily screen and deploy

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  screen:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: screen-ledger
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline deps
        run: |
          python -m venv pipeline/.venv
          pipeline/.venv/bin/python -m pip install --upgrade pip
          pipeline/.venv/bin/python -m pip install -r pipeline/requirements.txt

      - name: Run screener and paper ledger
        run: pipeline/.venv/bin/python pipeline/run_screen.py --keep-previous-if-empty --sleep 0.25

      - name: Commit data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/data/daily-picks.json apps/web/public/data/paper-portfolio.json
          if git diff --staged --quiet; then
            echo "No data file changes to commit"
          else
            git commit -m "chore: update daily picks and paper portfolio [skip ci]"
            git pull --rebase origin HEAD
            git push
          fi

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-data
          path: |
            apps/web/public/data/daily-picks.json
            apps/web/public/data/paper-portfolio.json

  build:
    needs: screen
    if: always() && (needs.screen.result == 'success' || needs.screen.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: pages-push
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download data
        if: needs.screen.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: daily-data
          path: apps/web/public/data

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install and build
        working-directory: apps/web
        env:
          VITE_BASE: /stock-trader/
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-push
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
